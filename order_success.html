{% extends 'base.html' %}

{% block content %}

<h1>Order Placed Successfully!</h1>

<p>Thank you for your purchase.</p>

<h2>Ordered Items</h2>

{% for item in items %}

    <div class="order-item">

        <h3>{{ item.title }}</h3>

        <p>Price: ₹{{ item.price }}</p>

    </div>

{% endfor %}

<hr>

<h2>Grand Total: ₹{{ total }}</h2>

<a href="{% url 'articles:list' %}">
    Continue Shopping
</a>

{% endblock %}
